name: Build - Control release evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-evidence:
    name: Build private Control evidence
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Define reproducible build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build OCI archive with embedded provenance and SBOM
        id: build-first
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          tags: midorivpn-control:2.0.0
          no-cache: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: type=oci,dest=${{ runner.temp }}/midorivpn-control-2.0.0.oci.tar,rewrite-timestamp=true
          provenance: mode=max
          sbom: true

      - name: Repeat the clean OCI build
        id: build-second
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          tags: midorivpn-control:2.0.0
          no-cache: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: type=oci,dest=${{ runner.temp }}/midorivpn-control-2.0.0.rebuild.oci.tar,rewrite-timestamp=true
          provenance: mode=max
          sbom: true

      - name: Compare clean build digests
        env:
          FIRST_DIGEST: ${{ steps.build-first.outputs.digest }}
          SECOND_DIGEST: ${{ steps.build-second.outputs.digest }}
        run: test -n "$FIRST_DIGEST" && test "$FIRST_DIGEST" = "$SECOND_DIGEST"

      - name: Generate independently verifiable evidence
        env:
          IMAGE_DIGEST: ${{ steps.build-first.outputs.digest }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist-release
          cp "${RUNNER_TEMP}/midorivpn-control-2.0.0.oci.tar" dist-release/
          CONTAINER_ENGINE=docker bash scripts/scan-oci.sh archive \
            dist-release/midorivpn-control-2.0.0.oci.tar \
            dist-release/midorivpn-control-2.0.0.trivy.json
          docker run --rm \
            -e SYFT_CACHE_DIR=/tmp/syft-cache \
            -v "${PWD}/dist-release:/artifacts" \
            ghcr.io/anchore/syft@sha256:41f8289664101d6ebab30a97ac8df6b6f86b92d8343285ca90f428e2bc353106 \
            scan oci-archive:/artifacts/midorivpn-control-2.0.0.oci.tar \
            -o spdx-json=/artifacts/midorivpn-control-2.0.0.spdx.json
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg digest "$IMAGE_DIGEST" \
            --argjson epoch "$SOURCE_DATE_EPOCH" \
            '{schema_version:1,component:"control",version:"2.0.0",commit:$commit,image_digest:$digest,source_date_epoch:$epoch}' \
            > dist-release/midorivpn-control-2.0.0.build.json
          (cd dist-release && sha256sum midorivpn-control-2.0.0.oci.tar midorivpn-control-2.0.0.spdx.json midorivpn-control-2.0.0.trivy.json midorivpn-control-2.0.0.build.json > SHA256SUMS)
          (cd dist-release && sha256sum -c SHA256SUMS)

      - name: Retain evidence for release review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: midorivpn-control-2.0.0-build-evidence
          path: dist-release/
          if-no-files-found: error
          retention-days: 14
