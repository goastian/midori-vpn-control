name: Publish - tagged private Control OCI candidate

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: midorivpn-control-${{ github.ref_name }}-candidate-publication
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/goastian/midori-vpn-control

jobs:
  validate-tag:
    name: Validate annotated candidate tag
    if: github.repository == 'goastian/midori-vpn-control-dev'
    runs-on: ubuntu-24.04
    steps:
      - name: Require the private candidate switch
        env:
          CANDIDATE_PUBLISH_ENABLED: ${{ vars.MIDORIVPN_PRIVATE_CANDIDATE_ENABLED }}
        run: test "$CANDIDATE_PUBLISH_ENABLED" = true

      - name: Checkout the complete tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an annotated semantic tag matching package metadata
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{}")" = "$GITHUB_SHA"
          product_version="$(node -p "require('./package.json').version")"
          release_version="${GITHUB_REF_NAME#v}"
          [[ "$release_version" == "$product_version" || "$release_version" == "$product_version"-* ]]

  publish:
    name: Rebuild, publish private Control candidate, attest and sign
    needs: validate-tag
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout the validated annotated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Define immutable release inputs
        run: |
          set -Eeuo pipefail
          product_version="$(node -p "require('./package.json').version")"
          release_version="${GITHUB_REF_NAME#v}"
          [[ "$release_version" == "$product_version" || "$release_version" == "$product_version"-* ]]
          {
            printf 'PRODUCT_VERSION=%s\n' "$product_version"
            printf 'RELEASE_VERSION=%s\n' "$release_version"
            printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_ENV"

      - name: Set up current pinned Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: First clean OCI build
        id: first
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          no-cache: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/goastian/midori-vpn-control-dev
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: type=oci,dest=${{ runner.temp }}/control-first.oci.tar,rewrite-timestamp=true
          provenance: mode=max
          sbom: true

      - name: Second clean OCI build
        id: second
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          no-cache: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/goastian/midori-vpn-control-dev
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: type=oci,dest=${{ runner.temp }}/control-second.oci.tar,rewrite-timestamp=true
          provenance: mode=max
          sbom: true

      - name: Require reproducible image digests
        env:
          FIRST_DIGEST: ${{ steps.first.outputs.digest }}
          SECOND_DIGEST: ${{ steps.second.outputs.digest }}
        run: test -n "$FIRST_DIGEST" && test "$FIRST_DIGEST" = "$SECOND_DIGEST"

      - name: Log in to GHCR without a persistent credential
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to replace an existing version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          error_file="$(mktemp)"
          if existing_tags="$(gh api --paginate '/orgs/goastian/packages/container/midori-vpn-control/versions?per_page=100' --jq '.[].metadata.container.tags[]?' 2>"$error_file")"; then
            :
          elif grep -Fq 'HTTP 404' "$error_file"; then
            existing_tags=""
          else
            echo 'error: unable to establish whether the Control version already exists' >&2
            exit 1
          fi
          if grep -Fxq "$RELEASE_VERSION" <<< "$existing_tags"; then
            echo "error: immutable Control version already exists" >&2
            exit 1
          fi

      - name: Push the rebuilt immutable image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/goastian/midori-vpn-control-dev
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          provenance: mode=max
          sbom: true

      - name: Require the pushed digest to match both clean builds
        env:
          FIRST_DIGEST: ${{ steps.first.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: test -n "$PUSHED_DIGEST" && test "$FIRST_DIGEST" = "$PUSHED_DIGEST"

      - name: Force and verify private package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method PATCH /orgs/goastian/packages/container/midori-vpn-control -f visibility=private >/dev/null
          test "$(gh api /orgs/goastian/packages/container/midori-vpn-control --jq .visibility)" = private

      - name: Scan the exact digest and generate independent SPDX
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist-release
          CONTAINER_ENGINE=docker bash scripts/scan-oci.sh image \
            "${IMAGE_NAME}@${IMAGE_DIGEST}" "dist-release/control-${RELEASE_VERSION}.trivy.json"
          docker run --rm -e SYFT_CACHE_DIR=/tmp/syft-cache \
            -v "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
            -v "${PWD}/dist-release:/artifacts" \
            ghcr.io/anchore/syft@sha256:41f8289664101d6ebab30a97ac8df6b6f86b92d8343285ca90f428e2bc353106 \
            scan "registry:${IMAGE_NAME}@${IMAGE_DIGEST}" \
            -o "spdx-json=/artifacts/control-${RELEASE_VERSION}.spdx.json"
          jq -n --arg version "$RELEASE_VERSION" --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" --arg digest "$IMAGE_DIGEST" \
            '{schema_version:1,component:"control",version:$version,tag:$tag,commit:$commit,image_digest:$digest,visibility:"private"}' \
            > "dist-release/control-${RELEASE_VERSION}.json"

      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-version: ${{ env.RELEASE_VERSION }}
          push-to-registry: true

      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-version: ${{ env.RELEASE_VERSION }}
          sbom-path: dist-release/control-${{ env.RELEASE_VERSION }}.spdx.json
          push-to-registry: true

      - name: Install current pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign and verify the digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -Eeuo pipefail
          tag_ref="${IMAGE_NAME}:${RELEASE_VERSION}"
          verification_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker pull "$tag_ref" >/dev/null
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tag_ref" | grep -Fx "$verification_ref"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$tag_ref")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$tag_ref")" = "$RELEASE_VERSION"
          identity="https://github.com/goastian/midori-vpn-control-dev/.github/workflows/publish.yml@refs/tags/${GITHUB_REF_NAME}"
          cosign sign --yes "$verification_ref"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$verification_ref"
          gh attestation verify "oci://${verification_ref}" --repo goastian/midori-vpn-control-dev \
            --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "oci://${verification_ref}" --repo goastian/midori-vpn-control-dev \
            --predicate-type https://spdx.dev/Document/v2.3
          (cd dist-release && sha256sum -- * > SHA256SUMS && sha256sum --check SHA256SUMS)

      - name: Retain private candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-${{ env.RELEASE_VERSION }}-private-evidence
          path: dist-release/
          if-no-files-found: error
          retention-days: 30
